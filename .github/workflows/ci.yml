name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Unit Tests
        run: npm run test
        working-directory: frontend

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build (fonts.googleapis.com blocked)
        run: |
          # Block Google Fonts to verify local fonts work
          echo "127.0.0.1 fonts.googleapis.com" | sudo tee -a /etc/hosts
          npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend
        run: |
          cd ../..
          pip install -r backend/requirements.txt
          python -m uvicorn backend.app.main:create_app --factory --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -f http://localhost:8000/healthz
      - name: Run Playwright tests
        env:
          API_BASE: http://localhost:8000
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run test:e2e
        working-directory: frontend